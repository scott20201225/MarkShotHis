name: Release MarkShotHis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to release (e.g. v0.2.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            build_cmd: npx electron-builder --linux AppImage deb tar.gz --x64 --publish never
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            build_cmd: npx electron-builder --linux AppImage deb tar.gz --arm64 --publish never
          - name: windows-x64
            os: windows-2022
            platform: windows
            arch: x64
            build_cmd: npx electron-builder --win nsis zip --x64 --publish never
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            arch: arm64
            build_cmd: npx electron-builder --win nsis zip --arm64 --publish never
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
            build_cmd: npx electron-builder --mac dmg zip --x64 --publish never
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64
            build_cmd: npx electron-builder --mac dmg zip --arm64 --publish never

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile application
        run: npm run build

      - name: Package installer
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markshothis-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes body
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          is_prerelease="false"
          if [[ "${tag}" == *"-"* ]]; then
            is_prerelease="true"
          fi
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

          {
            cat .github/release-notes/intro-bilingual.md
            echo
            if [[ "$is_prerelease" == "true" ]]; then
              echo "## ❗ This is a pre-release"
              echo "- May contain bugs and unfinished features."
              echo ""
            fi
            cat .github/release-notes/macos-unsigned-zh-CN.md
            echo
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          name: ${{ steps.notes.outputs.tag }}
          tag_name: ${{ steps.notes.outputs.tag }}
          body_path: release_body.md
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ steps.notes.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
