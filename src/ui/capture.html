<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>截图</title>
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./capture.css">
</head>
<body>
  <canvas id="background"></canvas>
  <div id="shade"></div>
  <canvas id="marks"></canvas>
  <div id="selection" hidden></div>
  <div id="toolbar" hidden aria-label="截图工具">
    <button data-tool="select" title="重新选区">选区</button>
    <button data-tool="pen" title="画笔">画笔</button>
    <button data-tool="rect" title="矩形">矩形</button>
    <button data-tool="arrow" title="箭头">箭头</button>
    <button data-tool="text" title="文本">文本</button>
    <button data-tool="number" title="有序标记">序号</button>
    <button data-tool="tag" title="标签">标签</button>
    <input id="color" type="color" value="#f04438" title="标注颜色" aria-label="标注颜色">
    <span class="divider"></span>
    <button id="undo" title="撤销" class="icon-button">↶</button>
    <button id="copy" title="复制截图">复制</button>
    <button id="save" title="保存截图">保存</button>
    <button id="pin" title="贴图" class="primary">贴图</button>
    <button id="close" title="取消" class="icon-button">×</button>
  </div>
  <textarea id="text-entry" hidden aria-label="标注文字" placeholder="输入文字"></textarea>
  <script src="./capture.js"></script>
</body>
</html>
