<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; script-src 'self'; style-src 'self'">
  <title>贴图</title>
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./pin.css">
</head>
<body>
  <header>
    <div class="drag-area">贴图</div>
    <button id="edit" title="编辑贴图">编辑</button>
    <button id="copy" title="复制">复制</button>
    <button id="save" title="保存">保存</button>
    <button id="close" class="icon-button" title="关闭">×</button>
  </header>
  <div id="image-wrap">
    <img id="image" alt="贴图内容">
    <canvas id="marks"></canvas>
    <textarea id="text-entry" hidden placeholder="输入文字" aria-label="贴图文字"></textarea>
  </div>
  <div id="edit-tools" hidden>
    <button data-tool="pen" title="画笔">画笔</button>
    <button data-tool="rect" title="矩形">矩形</button>
    <button data-tool="text" title="文本">文本</button>
    <input id="color" type="color" value="#f04438" title="标注颜色" aria-label="标注颜色">
    <button id="undo" title="撤销">撤销</button>
  </div>
  <script src="./pin.js"></script>
</body>
</html>
