<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; script-src 'self'; style-src 'self'">
  <title>剪贴板历史</title>
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./history.css">
</head>
<body>
  <header>
    <div class="drag-area"><strong>剪贴板历史</strong><span id="count"></span></div>
    <button id="close" class="icon-button" title="关闭">×</button>
  </header>
  <div class="search-row">
    <input id="search" type="search" placeholder="搜索文字或图片尺寸" aria-label="搜索历史">
    <button id="clear" title="清空历史">清空</button>
  </div>
  <main id="list"></main>
  <footer>点击条目复制；图片可直接贴图</footer>
  <script src="./history.js"></script>
</body>
</html>
